<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Injections et perf hospit</title>
  <meta name="description" content="Calcul des doses d'injection et de perfusion selon le poids de l'animal.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#162220" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Injections">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>Injections et perf hospit</h1>
      <button type="button" id="edit-toggle" class="btn btn-ghost">Modifier les doses</button>
    </div>

    <div class="controls">
      <label class="weight">
        <span class="weight-label">Poids</span>
        <input id="weight" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-describedby="warn">
        <span class="weight-unit">kg</span>
      </label>

      <fieldset class="seg">
        <legend class="sr-only">Espèce</legend>
        <label><input type="radio" name="species" value="all" checked><span>Tous</span></label>
        <label><input type="radio" name="species" value="CN"><span>Chien</span></label>
        <label><input type="radio" name="species" value="CT"><span>Chat</span></label>
      </fieldset>
    </div>

    <p id="warn" class="warn" role="alert" hidden></p>
  </header>

  <main id="main"></main>

  <footer id="foot">
    <p class="disclaimer">Aide au calcul. Les doses affichées sont celles enregistrées dans l'appli : à vérifier avant chaque injection.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
